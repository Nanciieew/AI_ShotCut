[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-analysis-platform"
version = "0.1.0"
description = "Multi-model video analysis backend for shot detection, scene merging, and scene scoring."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "AI ShotCut Team" },
]
keywords = ["video-analysis", "shot-detection", "scene-segmentation", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["apps*", "core*", "models*", "pipelines*", "schemas*"]
exclude = ["tests*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".venv-omnishotcut/",
    "third_party/",
    "model_store/",
    ".git/",
    "__pycache__/",
    ".pytest_cache/",
    "alembic/versions/",
    "models/*/patches/",
    "*.md",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501", "N803", "N806"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
explicit_package_bases = true
exclude = [
    "third_party/",
    "model_store/",
    "tests/",
    "scripts/",
    "alembic/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/third_party/*",
    "*/model_store/*",
    "*/alembic/*",
    "*/scripts/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

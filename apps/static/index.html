<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI ShotCut — Movie Scene Analysis</title>
<style>
:root {
  --bg: #0f1117; --panel: #1a1d27; --border: #2a2d3a;
  --text: #e1e4ed; --muted: #8b8fa3; --accent: #6c8cff; --danger: #ff5c5c;
  --success: #4ade80; --warn: #fbbf24; --grad-start: #4f46e5; --grad-end: #7c3aed;
  --radius: 10px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh; }
.app { max-width: 1200px; margin: 0 auto; padding: 24px; }
header { text-align: center; padding: 40px 0 30px; }
h1 { font-size: 2rem; background: linear-gradient(135deg, var(--grad-start), var(--grad-end));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; }
.subtitle { color: var(--muted); font-size: 0.9rem; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 24px; }
.card.full { grid-column: 1 / -1; }
.card h2 { font-size: 1.1rem; margin-bottom: 16px; color: var(--accent); }

.upload-zone { border: 2px dashed var(--border); border-radius: var(--radius);
  padding: 40px; text-align: center; cursor: pointer; transition: .2s; }
.upload-zone:hover, .upload-zone.drag { border-color: var(--accent); background: #1a1f3540; }
.upload-zone p { color: var(--muted); }

.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.row label { color: var(--muted); min-width: 90px; font-size: 0.85rem; }
select, input[type="text"], input[type="number"] {
  background: var(--bg); border: 1px solid var(--border); color: var(--text);
  padding: 8px 12px; border-radius: 6px; font-size: 0.9rem; outline: none;
}
select:focus, input:focus { border-color: var(--accent); }
.btn { padding: 10px 24px; border: none; border-radius: 6px; font-size: 0.9rem;
  font-weight: 600; cursor: pointer; transition: .2s; }
.btn-primary { background: linear-gradient(135deg, var(--grad-start), var(--grad-end));
  color: #fff; width: 100%; margin-top: 8px; }
.btn-primary:hover { opacity: 0.9; }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

.progress-bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin: 12px 0; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--grad-start), var(--grad-end));
  border-radius: 4px; transition: width .5s; }
.stage-text { color: var(--muted); font-size: 0.85rem; text-align: center; }

.scene-list { max-height: 400px; overflow-y: auto; }
.scene-item { display: flex; justify-content: space-between; align-items: center;
  padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
.scene-item:hover { background: #ffffff06; }
.scene-time { color: var(--accent); font-family: monospace; min-width: 140px; }
.scene-score { font-weight: 700; min-width: 50px; text-align: right; }
.score-high { color: var(--success); } .score-mid { color: var(--warn); } .score-low { color: var(--muted); }

.badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 0.75rem;
  font-weight: 600; }
.badge-ok { background: #4ade8020; color: var(--success); }
.badge-err { background: #ff5c5c20; color: var(--danger); }

.file-info { color: var(--muted); font-size: 0.8rem; margin-top: 8px; }

.tabs { display: flex; gap: 4px; margin-bottom: 16px; }
.tab { padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
  color: var(--muted); border: 1px solid transparent; }
.tab.active { color: var(--accent); border-color: var(--accent); background: #6c8cff10; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>AI ShotCut</h1>
    <p class="subtitle">Movie Scene Analysis · AI-Powered Shot Boundary Detection & Scene Scoring</p>
  </header>

  <div class="grid">
    <!-- Upload -->
    <div class="card">
      <h2>1. Upload Video</h2>
      <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <p>📁 Click to upload or drag & drop</p>
        <p class="file-info" id="fileInfo">No file selected</p>
      </div>
      <input type="file" id="fileInput" accept="video/*" hidden>
      <div class="row" style="margin-top:12px">
        <label>Project</label>
        <input type="text" id="projectId" value="my_project" style="flex:1">
      </div>
      <button class="btn btn-primary" id="uploadBtn" onclick="uploadVideo()">Upload & Submit</button>
      <p class="file-info" id="uploadStatus"></p>
    </div>

    <!-- Pipeline Config -->
    <div class="card">
      <h2>2. Pipeline Settings</h2>
      <div class="tabs" id="scoreTabs">
        <span class="tab active" data-mode="weighted">Weighted</span>
        <span class="tab" data-mode="location_only">Location</span>
        <span class="tab" data-mode="character_only">Character</span>
        <span class="tab" data-mode="plot_only">Plot</span>
        <span class="tab" data-mode="custom">Custom</span>
      </div>
      <div id="customWeights" style="display:none">
        <div class="row"><label>Location</label><input type="number" id="wLoc" value="5" min="1" max="10" style="width:70px"><span style="color:var(--muted);font-size:0.8rem">/10</span></div>
        <div class="row"><label>Character</label><input type="number" id="wChar" value="3" min="1" max="10" style="width:70px"><span style="color:var(--muted);font-size:0.8rem">/10</span></div>
        <div class="row"><label>Plot</label><input type="number" id="wPlot" value="2" min="1" max="10" style="width:70px"><span style="color:var(--muted);font-size:0.8rem">/10</span></div>
      </div>
      <div class="row"><label>Intensity</label>
        <select id="intensity"><option value="medium">Medium (4%)</option><option value="high">High (6%)</option><option value="low">Low (1%)</option></select>
      </div>
      <div class="row"><label>Min Gap</label>
        <select id="minDist"><option value="12">12s</option><option value="8">8s</option><option value="20">20s</option></select>
      </div>
      <div class="row"><label>Analysis</label>
        <select id="sceneAnalysis"><option value="true">Full Scene Scoring</option><option value="false">Shot Detection Only</option></select>
      </div>
    </div>
  </div>

  <!-- Progress -->
  <div class="grid" style="margin-top:20px">
    <div class="card full" id="progressCard" style="display:none">
      <h2>3. Progress</h2>
      <p class="stage-text" id="stageLabel">Waiting...</p>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <p class="stage-text" id="progressText">0%</p>
      <p class="file-info" style="text-align:center" id="elapsedLabel"></p>
    </div>
  </div>

  <!-- Results -->
  <div class="grid" style="margin-top:20px">
    <div class="card full" id="resultsCard" style="display:none">
      <h2>4. Results</h2>
      <p class="file-info" id="resultSummary"></p>
      <div class="scene-list" id="sceneList"></div>
    </div>
  </div>
</div>

<script>
const API = '';
let videoId = '', currentMode = 'weighted';

// Tab switching
document.getElementById('scoreTabs').addEventListener('click', e => {
  if (!e.target.classList.contains('tab')) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  e.target.classList.add('active');
  currentMode = e.target.dataset.mode;
  document.getElementById('customWeights').style.display = currentMode === 'custom' ? 'block' : 'none';
});

// Drag & drop
const dz = document.getElementById('dropZone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('drag');
  const f = e.dataTransfer.files[0];
  if (f) { document.getElementById('fileInput').files = e.dataTransfer.files;
    document.getElementById('fileInfo').textContent = f.name + ' (' + (f.size/1e6).toFixed(1) + ' MB)'; }
});
document.getElementById('fileInput').addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) document.getElementById('fileInfo').textContent = f.name + ' (' + (f.size/1e6).toFixed(1) + ' MB)';
});

let pollTimer = null;

function buildPayload() {
  const sceneAnalysis = document.getElementById('sceneAnalysis').value === 'true';
  const mode = currentMode;
  const p = new FormData();
  p.append('project_id', document.getElementById('projectId').value || 'default');
  p.append('extract_keyframes', 'true');
  p.append('scene_analysis', sceneAnalysis);
  p.append('score_mode', mode);
  p.append('cut_intensity', document.getElementById('intensity').value);
  p.append('min_distance_s', document.getElementById('minDist').value);
  if (mode === 'custom') {
    p.append('location_weight', document.getElementById('wLoc').value);
    p.append('character_weight', document.getElementById('wChar').value);
    p.append('plot_weight', document.getElementById('wPlot').value);
  }
  // video_path auto-resolved, shot_model defaults to ffmpeg_scene
  return p;
}

async function uploadVideo() {
  const file = document.getElementById('fileInput').files[0];
  if (!file) { alert('Select a video file first'); return; }

  const form = new FormData();
  form.append('file', file);
  form.append('project_id', document.getElementById('projectId').value || 'default');

  const status = document.getElementById('uploadStatus');
  status.textContent = 'Uploading...';
  try {
    const r = await fetch(API + '/api/v1/videos', { method: 'POST', body: form });
    const d = await r.json();
    if (d.video_id) {
      videoId = d.video_id;
      status.innerHTML = `<span class="badge badge-ok">Upload OK</span> ${d.video_id}`;
      document.getElementById('fileInfo').textContent = d.filename + ' (' + (d.size_bytes/1e6).toFixed(1) + ' MB)';
      // Auto-start pipeline
      await startPipeline();
    } else {
      status.innerHTML = `<span class="badge badge-err">Failed</span> ${JSON.stringify(d)}`;
    }
  } catch(e) {
    status.innerHTML = `<span class="badge badge-err">Error</span> ${e.message}`;
  }
}

async function startPipeline() {
  if (!videoId) return;
  const form = buildPayload();
  try {
    const r = await fetch(API + '/api/v1/videos/' + videoId + '/analyze-shots', { method: 'POST', body: form });
    const d = await r.json();
    if (d.task_id) {
      document.getElementById('progressCard').style.display = 'block';
      document.getElementById('uploadStatus').innerHTML +=
        '<br><span class="badge badge-ok">Pipeline started</span> ' + d.celery_task_id;
      pollProgress(d.task_id);
    }
  } catch(e) {
    document.getElementById('uploadStatus').innerHTML +=
      '<br><span class="badge badge-err">Start failed</span> ' + e.message;
  }
}

async function pollProgress(taskId) {
  const startTime = Date.now();
  pollTimer = setInterval(async () => {
    try {
      const r = await fetch(API + '/api/v1/tasks/' + taskId);
      const d = await r.json();
      const pct = d.progress || 0;
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('progressText').textContent = pct + '%';
      document.getElementById('stageLabel').textContent = d.stage || 'Running...';
      const elapsed = Math.round((Date.now() - startTime) / 1000);
      document.getElementById('elapsedLabel').textContent = 'Elapsed: ' + elapsed + 's';

      if (d.status === 'SUCCEEDED' || d.status === 'FAILED') {
        clearInterval(pollTimer);
        if (d.status === 'SUCCEEDED') {
          document.getElementById('stageLabel').innerHTML = '<span class="badge badge-ok">Complete</span>';
          loadResults();
        } else {
          document.getElementById('stageLabel').innerHTML = '<span class="badge badge-err">Failed: ' + (d.error_message||'') + '</span>';
        }
      }
    } catch(e) { /* keep polling */ }
  }, 2000);
}

async function loadResults() {
  if (!videoId) return;
  try {
    const r = await fetch(API + '/api/v1/videos/' + videoId + '/results');
    const d = await r.json();
    // Try to fetch final_result.json via the task API
    const r2 = await fetch(API + '/api/v1/videos/' + videoId);
    const info = await r2.json();

    document.getElementById('resultsCard').style.display = 'block';
    const scenes = d.final_scenes || [];
    const boundaries = d.candidate_boundaries || [];
    document.getElementById('resultSummary').textContent =
      scenes.length + ' scenes · ' + boundaries.length + ' boundaries selected';

    const list = document.getElementById('sceneList');
    list.innerHTML = '';
    if (scenes.length > 0) {
      scenes.forEach(s => {
        const div = document.createElement('div'); div.className = 'scene-item';
        const ms_to_str = ms => { const m=Math.floor(ms/60000); const ss=((ms%60000)/1000).toFixed(1); return m+':'+ss.padStart(4,'0'); };
        const sc = s.scene_score || 0;
        const cls = sc > 70 ? 'score-high' : sc > 40 ? 'score-mid' : 'score-low';
        div.innerHTML = `<span class="scene-time">${ms_to_str(s.start_ms)} → ${ms_to_str(s.end_ms)}</span>
          <span style="flex:1;margin:0 12px">${s.start_shot} → ${s.end_shot}</span>
          <span class="scene-score ${cls}">${sc}</span>`;
        list.appendChild(div);
      });
    } else {
      list.innerHTML = '<p class="file-info">Results loading — check artifacts for final_result.json</p>';
    }
  } catch(e) {
    document.getElementById('resultSummary').textContent = 'Results not yet available: ' + e.message;
  }
}

// Check if task is already running on page load
(async function() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('task')) pollProgress(params.get('task'));
})();
</script>
</body>
</html>

# ============================================================
# Movie Analysis Platform — Docker Compose
# ============================================================
# Direct pipeline — no Celery, no Redis. Pipeline runs
# in FastAPI background thread via WorkflowService.
#
# Usage:
#   docker compose up -d              # Start all services
#   docker compose logs -f api        # Follow API logs
#   docker compose down               # Stop all services

services:
  # --- PostgreSQL (Database) ---
  postgres:
    image: postgres:16-alpine
    container_name: movie-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: movie_analysis
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # --- Database Migration (one-shot) ---
  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: movie-migrate
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/movie_analysis
      - STORAGE_ROOT=/data
      - MODEL_STORE_ROOT=/models
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    command: alembic upgrade head

  # --- FastAPI Application ---
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: movie-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/movie_analysis
      - STORAGE_ROOT=/data
      - MODEL_STORE_ROOT=/models
      - DEBUG=true
      - ENVIRONMENT=development
      - PROVIDER_INTERNAL_URL=http://provider:8001
    volumes:
      - .:/app
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --- Provider Gateway (only signed artifact downloads) ---
  provider:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: movie-provider
    # Local diagnostics only. Public traffic reaches this service through ngrok.
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/movie_analysis
      - STORAGE_ROOT=/data
      - MODEL_STORE_ROOT=/models
      - DEBUG=false
      - ENVIRONMENT=development
    volumes:
      - .:/app
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    command: uvicorn apps.api.provider_app:app --host 0.0.0.0 --port 8001
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/live', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- Public HTTPS tunnel for the Provider Gateway only ---
  ngrok:
    image: ngrok/ngrok:latest
    container_name: movie-ngrok
    env_file:
      - .env
    command:
      - http
      - provider:8001
      - --url=${PUBLIC_BASE_URL}
      - --log=stdout
    depends_on:
      provider:
        condition: service_healthy
    restart: unless-stopped

volumes:
  data-volume:
  model-store-volume:
  postgres-data:

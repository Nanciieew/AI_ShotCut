# ============================================================
# Model Registry — canonical model metadata and licensing.
# ============================================================
# Rules:
#   1. enabled=false until the model is fully installed and tested.
#   2. Do NOT guess license — mark as "unknown" until verified.
#   3. Record fixed commit hash at integration time.
#   4. Code license, weight license, and dataset license are distinct.

models:
  ffmpeg_scene:
    task: shot_boundary_detection
    description: Detects shot boundaries via FFmpeg scene filter. No GPU, no PyTorch.
    repository: ""
    revision: ""
    code_license: unknown
    weights_license: unknown
    dataset_license: unknown
    commercial_use: true
    adapter: models.ffmpeg_scene.adapter.FFmpegSceneAdapter
    enabled: true
    requires_gpu: false
    notes: |
      5-second CPU alternative to OmniShotCut. Uses FFmpeg select filter.
      threshold=0.1 for best recall; VLM will re-score all boundaries.

  omnishotcut:
    task: shot_boundary_detection
    description: Detects shot boundaries (hard cuts, dissolves, wipes) in video.
    repository: https://github.com/UVA-Computer-Vision-Lab/OmniShotCut
    revision: 23ad6fb41b296fb9258b0e7825125a914573b906
    code_license: MIT
    weights_license: MIT
    dataset_license: unknown
    commercial_use: true
    attribution_required: true
    redistribution_allowed: true
    adapter: models.omnishotcut.adapter.OmniShotCutAdapter
    enabled: false
    requires_gpu: false
    notes: |
      UVA Computer Vision Lab. MIT License for both code AND weights.
      Weights: HuggingFace Hub (uva-cv-lab/OmniShotCut).
      Verified: installs cleanly, loads on CPU with minor patch.
      GPU optional — CPU inference works at ~22s for short clip.

  whisper:
    task: speech_to_text
    description: Speech recognition with word-level timestamps.
    repository: https://github.com/openai/whisper
    revision: ""
    code_license: MIT
    weights_license: MIT
    dataset_license: unknown
    commercial_use: true
    attribution_required: false
    redistribution_allowed: true
    adapter: models.whisper.adapter.WhisperAdapter
    enabled: false
    requires_gpu: true
    notes: |
      OpenAI Whisper — MIT license. Large-v3 model weights also MIT.
      Confirm dataset license for training data if redistribution matters.

  scene_boundary:
    task: scene_boundary_detection
    description: Predicts scene boundaries from multi-modal features.
    repository: ""
    revision: ""
    code_license: unknown
    weights_license: unknown
    dataset_license: unknown
    commercial_use: unknown
    attribution_required: unknown
    redistribution_allowed: unknown
    adapter: models.scene_boundary.adapter.SceneBoundaryAdapter
    enabled: false
    requires_gpu: true
    notes: |
      Candidate models: SceneSeg, BaSSL. Selection pending.

  visual_encoder:
    task: visual_feature_extraction
    description: Extracts per-shot visual embeddings.
    repository: ""
    revision: ""
    code_license: unknown
    weights_license: unknown
    dataset_license: unknown
    commercial_use: unknown
    adapter: models.visual_encoder.adapter.VisualEncoderAdapter
    enabled: false
    requires_gpu: true

  audio_encoder:
    task: audio_feature_extraction
    description: Extracts per-shot or per-window audio embeddings.
    repository: ""
    revision: ""
    code_license: unknown
    weights_license: unknown
    dataset_license: unknown
    commercial_use: unknown
    adapter: models.audio_encoder.adapter.AudioEncoderAdapter
    enabled: false
    requires_gpu: false

  vlm_scene_boundary:
    task: scene_boundary_detection
    description: Scores shot boundaries for location + character change via Qwen2.5-VL.
    repository: ""
    revision: ""
    code_license: unknown
    weights_license: unknown
    dataset_license: unknown
    commercial_use: false
    adapter: models.vlm_boundary.adapter.VLMSceneBoundaryAdapter
    enabled: false
    requires_gpu: false
    notes: |
      Qwen2.5-VL via modelarts-maas API. API key in QWEN_VL_API_KEY env var.
      Outputs location_character_scores.json per boundary.

  plot_event:
    task: plot_event_segmentation
    description: Plans narrative event tree and scores shot boundaries for plot change via DeepSeek.
    repository: ""
    revision: ""
    code_license: unknown
    weights_license: unknown
    dataset_license: unknown
    commercial_use: false
    adapter: models.llm_plot.adapter.PlotEventAdapter
    enabled: false
    requires_gpu: false
    notes: |
      DeepSeek via modelarts-maas API (shared key with Qwen). API key in QWEN_VL_API_KEY.
      Outputs plot_scores.json with event tree.

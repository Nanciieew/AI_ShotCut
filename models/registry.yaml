# ============================================================
# Model Registry — canonical model metadata and licensing.
# ============================================================
# Rules:
#   1. enabled=false until the model is fully installed and tested.
#   2. Do NOT guess license — mark as "unknown" until verified.
#   3. Record fixed commit hash at integration time.
#   4. Code license, weight license, and dataset license are distinct.

models:
  doubao_asr:
    task: speech_to_text
    description: Doubao SeedASR via Volcano Engine OpenSpeech. Async submit + poll.
    repository: ""
    revision: ""
    code_license: unknown
    weights_license: unknown
    dataset_license: unknown
    commercial_use: false
    adapter: models.doubao_asr.adapter.DoubaoASRAdapter
    enabled: true
    requires_gpu: false
    notes: |
      Volcano Engine SeedASR (豆包录音文件识别 2.0). API key via VOLC_APP_ID + VOLC_ACCESS_TOKEN.
      Audio served via HMAC-signed artifact endpoint + ngrok PUBLIC_BASE_URL.

  ffmpeg_scene:
    task: shot_boundary_detection
    description: Detects shot boundaries via FFmpeg scene filter. No GPU, no PyTorch.
    repository: ""
    revision: ""
    code_license: unknown
    weights_license: unknown
    dataset_license: unknown
    commercial_use: true
    adapter: models.ffmpeg_scene.adapter.FFmpegSceneAdapter
    enabled: true
    requires_gpu: false
    notes: |
      5-second CPU shot detection via FFmpeg scene filter.
      threshold=0.1 for best recall; VLM will re-score all boundaries.

  # whisper: REMOVED — Doubao ASR not currently needed. See commit log for recovery.
  # omnishotcut: REMOVED — replaced by ffmpeg_scene. See commit log for recovery.

  doubao_vision:
    task: scene_boundary_detection
    description: Doubao-Seed-1.6-vision via Volcano Ark. Dynamic-frame Shot descriptors, bounded concurrent registry batches, and deterministic boundary scoring.
    repository: ""
    revision: ""
    code_license: unknown
    weights_license: unknown
    dataset_license: unknown
    commercial_use: false
    adapter: models.doubao_vision.adapter.DoubaoVisionAdapter
    enabled: true
    requires_gpu: false
    notes: |
      Volcano Ark vision model. API key via VOLC_VISION_API_KEY.
      /v3/chat/completions, OpenAI-compatible. Adapter version 1.2.0 uses
      dynamic frame counts and bounded three-Shot batches with registry reconciliation.

  vlm_scene_boundary:
    task: scene_boundary_detection
    description: Scores shot boundaries for location + character change via Qwen2.5-VL.
    repository: ""
    revision: ""
    code_license: unknown
    weights_license: unknown
    dataset_license: unknown
    commercial_use: false
    adapter: models.vlm_boundary.adapter.VLMSceneBoundaryAdapter
    enabled: false
    requires_gpu: false
    notes: |
      Qwen2.5-VL via modelarts-maas API. API key in QWEN_VL_API_KEY env var.
      Outputs location_character_scores.json per boundary.

  subtitle_semantic:
    task: subtitle_continuity_analysis
    description: Cached and batched hierarchical subtitle semantics mapped to shot-boundary continuity evidence.
    repository: ""
    revision: ""
    code_license: unknown
    weights_license: unknown
    dataset_license: unknown
    commercial_use: false
    adapter: models.subtitle_semantic.adapter.SubtitleSemanticAdapter
    enabled: true
    requires_gpu: false
    notes: |
      DeepSeek via modelarts-maas API. API key in DEEPSEEK_API_KEY.
      Discovers global/local candidates, uniformly rescores them, and outputs
      subtitle_continuity in [0,1]. Version 1.1.0 caches summary/global/local/rescore
      phases independently, batches up to three local intervals, and records request telemetry.

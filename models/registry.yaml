# ============================================================
# Model Registry — canonical model metadata and licensing.
# ============================================================
# Rules:
#   1. enabled=false until the model is fully installed and tested.
#   2. Do NOT guess license — mark as "unknown" until verified.
#   3. Record fixed commit hash at integration time.
#   4. Code license, weight license, and dataset license are distinct.

models:

# ============================================================
# Production Environment Configuration
# ============================================================

app:
  name: movie-analysis-platform
  debug: false
  api_host: "0.0.0.0"
  api_port: 8000

database:
  url: "postgresql+asyncpg://user:password@postgres:5432/movie_analysis"
  echo_sql: false

redis:
  url: "redis://redis:6379/0"

storage:
  backend: "local"
  root: "/data"
  # backend: "s3"
  # s3:
  #   bucket: "movie-analysis-artifacts"
  #   region: "us-east-1"
  #   access_key: ""
  #   secret_key: ""

model_store:
  root: "/models"

logging:
  level: "INFO"
  format: "structured"
  output: "stdout"

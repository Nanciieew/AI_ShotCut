# ============================================================
# Model Registry Configuration
# ============================================================
# Each model must be registered here before it can be used.
# The adapter field points to the Python class that implements BaseModelAdapter.

models:
  omnishotcut:
    enabled: false
    adapter: "models.omnishotcut.adapter.OmniShotCutAdapter"
    version: "1.0.0"
    device: "cuda:0"
    weights_uri: "model-store://omnishotcut/1.0.0/model.pth"
    parameters:
      mode: "clean_shot"

  whisper:
    enabled: false
    adapter: "models.whisper.adapter.WhisperAdapter"
    version: "large-v3"
    device: "cuda:0"
    parameters:
      word_timestamps: true

  scene_boundary:
    enabled: false
    adapter: "models.scene_boundary.adapter.SceneBoundaryAdapter"
    version: "0.1.0"
    device: "cuda:0"
    weights_uri: "model-store://scene_boundary/0.1.0/model.ckpt"

  visual_encoder:
    enabled: false
    adapter: "models.visual_encoder.adapter.VisualEncoderAdapter"
    version: "1.0.0"
    device: "cuda:0"

  audio_encoder:
    enabled: false
    adapter: "models.audio_encoder.adapter.AudioEncoderAdapter"
    version: "1.0.0"
    device: "cuda:0"

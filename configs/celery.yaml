# ============================================================
# Celery Configuration
# ============================================================
# These settings map directly to Celery configuration parameters.
# See: https://docs.celeryq.dev/en/stable/userguide/configuration.html

# --- Broker & Result Backend ---
broker_url: "redis://localhost:6379/0"
result_backend: "redis://localhost:6379/1"

# --- Serialization ---
task_serializer: "json"
result_serializer: "json"
accept_content: ["json"]
timezone: "Asia/Shanghai"
enable_utc: true

# --- Task Execution ---
task_track_started: true
task_acks_late: true
task_reject_on_worker_lost: true
worker_prefetch_multiplier: 1

# --- Retry & Broker Connectivity ---
broker_connection_retry_on_startup: true
broker_connection_max_retries: 10
broker_connection_timeout: 30

# --- Task Time Limits (seconds) ---
# Soft limit: exception raised inside task, allows cleanup
# Hard limit: task killed by worker
task_soft_time_limit: 3600
task_time_limit: 7200

# --- Result Expiry ---
# Results are only needed for status queries, not long-term storage.
# Large data MUST be stored via Artifact storage, not result backend.
result_expires: 3600

# --- Worker ---
worker_concurrency: 1
worker_max_tasks_per_child: 50

